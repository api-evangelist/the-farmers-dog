name: The Farmer's Dog
description: >-
  The Farmer's Dog is a direct-to-consumer pet health company that delivers
  fresh, human-grade dog food on a personalized subscription. Customers complete
  an online profile of their dog (breed, age, weight, activity, health goals) and
  the company formulates and ships pre-portioned meal plans on a recurring
  cadence. Founded in 2014 and headquartered in New York City, it is backed by
  Forerunner Ventures among others and has delivered over one billion meals
  nationwide. The business runs on a JavaScript/TypeScript stack with an internal
  "Core API" that powers ordering, subscription management, and its veterinarian
  program, but the company does not publish a public developer platform, API
  documentation, or client SDKs. This profile captures its public identity and
  domain-security posture; there is no public API surface to catalog.
